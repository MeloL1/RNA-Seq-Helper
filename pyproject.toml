[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-helper"
version = "0.1.0"
description = "A local, auditable RNA-seq preparation and analysis helper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8,<4",
  "scipy>=1.12,<2",
  "PySide6>=6.10.3,<6.11",
  "openpyxl>=3.1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "py2app>=0.28", "xlwt>=1.3,<2"]

[project.scripts]
rnaseq-helper = "rnaseq_helper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
